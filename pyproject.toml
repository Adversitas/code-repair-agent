[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repairagent"
version = "0.1.0"
description = "Execute-and-repair LLM coding agent: does sandbox test feedback beat resampling? Measured on MBPP."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
llm = ["torch>=2.2", "transformers>=4.45", "accelerate"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
repairagent = "repairagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
